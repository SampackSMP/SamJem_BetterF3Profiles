plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

loom {
    runs {
        client {
            property "mixin.debug", "true"
        }
    }
}

repositories {
    maven { url = "https://maven.neoforged.net/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
}

dependencies {
    modules {
        // https://github.com/google/guava/issues/6618 - fixes a duplicate classes error
        module("com.google.guava:listenablefuture") {
            replacedBy("com.google.guava:guava", "listenablefuture is part of guava")
        }
    }

    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}", {
        exclude module: "guava"
    }

    modImplementation "maven.modrinth:betterf3:${rootProject.betterf3_neoforge_version}"

    // Dev runtime only. BetterF3++ does not use Cloth Config - its screens are vanilla widgets -
    // but BetterF3's neoforge.mods.toml marks cloth_config mandatory, so without it the dev
    // client stops at "Mod betterf3 requires cloth_config 15.0.0 or above". Real users get it
    // transitively, because that same dependency forces them to install it.
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_version}") {
        exclude module: "fabric-api"
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn(shadowJar)
    archiveClassifier.set("NeoForge-${rootProject.minecraft_version}")
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
}
